<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .flame {
      animation: flicker 1.6s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 50% 100%;
    }

    .core {
      animation: core-pulse 1.1s ease-in-out infinite alternate;
      transform-box: fill-box;
      transform-origin: 50% 100%;
    }

    .ember {
      animation: rise 1.8s ease-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .ember-two {
      animation-delay: -0.9s;
    }

    @keyframes flicker {
      0%, 100% { transform: translateY(0) scale(1) rotate(0deg); }
      28% { transform: translateY(1px) scale(0.98, 1.03) rotate(-1.4deg); }
      58% { transform: translateY(-1px) scale(1.03, 0.98) rotate(1.2deg); }
      78% { transform: translateY(0) scale(0.99, 1.02) rotate(-0.6deg); }
    }

    @keyframes core-pulse {
      from { opacity: 0.82; transform: scale(0.94, 1); }
      to { opacity: 1; transform: scale(1.04, 0.96); }
    }

    @keyframes rise {
      0%, 28% { opacity: 0; transform: translate(0, 3px) scale(0.6) rotate(0deg); }
      44% { opacity: 1; }
      100% { opacity: 0; transform: translate(-3px, -12px) scale(0.9) rotate(90deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .flame,
      .core,
      .ember {
        animation: none;
      }

      .ember {
        display: none;
      }
    }
  </style>
  <rect x="2" y="2" width="60" height="60" rx="11" fill="#111a18"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="10.25" fill="none" stroke="#35413e" stroke-width="1.5"/>
  <g class="flame">
    <path fill="#ff5a36" d="M34 7c2 9 13 14 14 27 1 12-7 21-17 21s-17-7-17-17c0-8 4-14 10-21 0 6 2 10 6 13 3-7 1-15 4-23Z"/>
    <path class="core" fill="#ffb15f" d="M31 27c1 6 8 9 8 17 0 6-4 11-10 11s-10-4-10-10c0-5 3-10 8-15 0 4 1 8 4 10 2-4 0-8 0-13Z"/>
    <path fill="#fff3c4" d="M29 39c1 4 5 6 5 10 0 3-2 6-5 6s-6-3-6-6c0-4 3-6 5-9 0 2 0 3 1 4 1-2 0-3 0-5Z"/>
  </g>
  <rect class="ember" x="42" y="17" width="4" height="4" fill="#bcec75"/>
  <rect class="ember ember-two" x="18" y="22" width="3" height="3" fill="#ffb15f"/>
</svg>
